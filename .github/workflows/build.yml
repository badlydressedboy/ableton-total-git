name: Build and test
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: git lfs version
      - run: dotnet restore AbletonGit.sln --configfile NuGet.Config
      - run: dotnet build AbletonGit.sln -c Release --no-restore
      - run: dotnet run --project tests/AbletonGit.Tests -c Release --no-build --no-restore
